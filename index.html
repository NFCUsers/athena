<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jessica Mercurio Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

<style>
/* =========================================================
   Paleta y tipografía
   ========================================================= */
:root{
  --cream:      #f6efe9;   /* fondo general */
  --cream-soft: #faf5f1;   /* bandas claras */
  --ink:        #3b322c;   /* texto principal */
  --muted:      #8b7a6c;   /* texto secundario */
  --line:       #d8c4b6;   /* filetes y marcos */
  --rose:       #c39a89;   /* acento */

  --frame-inset: 14px;
  --max: 1280px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:17px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
body.no-scroll{overflow:hidden;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}

/* Marco fino alrededor de toda la página */
.page-frame{
  position:fixed;
  inset:var(--frame-inset);
  border:1px solid var(--line);
  pointer-events:none;
  z-index:60;
}
.page-frame::after{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(216,196,182,.45);
}

/* ---------- Ornamentos ---------- */
.corner{
  position:absolute;
  width:26px;height:26px;
  color:var(--line);
  pointer-events:none;
}
.corner.tl{top:7px;left:7px;}
.corner.tr{top:7px;right:7px;transform:scaleX(-1);}
.corner.bl{bottom:7px;left:7px;transform:scaleY(-1);}
.corner.br{bottom:7px;right:7px;transform:scale(-1,-1);}

.rule{
  display:flex;align-items:center;justify-content:center;
  gap:14px;
  color:var(--line);
}
.rule::before,.rule::after{
  content:"";
  height:1px;width:70px;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}

/* =========================================================
   HERO
   ========================================================= */
.hero{
  position:relative;
  min-height:74vh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:110px 24px;
  /* Reemplaza images/hero.jpg por tu propia imagen */
  background:
    linear-gradient(rgba(246,239,233,.28),rgba(246,239,233,.28)),
    url('images/hero.jpg') center/cover no-repeat,
    linear-gradient(120deg,#e9dcd1,#f3e7de 45%,#e6d5c8);
  border-bottom:1px solid var(--line);
}
.hero-inner{max-width:640px;}
.hero .ornament{color:var(--rose);opacity:.85;}
.hero h1{
  font-family:"Cinzel",serif;
  font-size:clamp(1.3rem,3vw,1.9rem);
  font-weight:400;
  letter-spacing:.16em;
  line-height:1.6;
  margin:26px 0 22px;
}

/* =========================================================
   SECCIONES
   ========================================================= */
.section{
  max-width:var(--max);
  margin:0 auto;
  padding:96px 40px;
}
.section-head{text-align:center;margin-bottom:64px;}

/* ---------- Rejilla de productos ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:54px 42px;
}
.card{position:relative;}
.frame{
  position:relative;
  aspect-ratio:1/1;
  border:1px solid var(--line);
  background:var(--cream-soft);
  overflow:hidden;
}
.frame img{
  width:100%;height:100%;
  object-fit:cover;
  cursor:zoom-in;
  transition:transform 1.2s cubic-bezier(.2,.7,.2,1);
}
.card:hover .frame img{transform:scale(1.05);}
.frame .corner{z-index:2;}

.card-foot{
  margin-top:16px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  color:var(--line);
}
.card-foot::before,.card-foot::after{
  content:"";height:1px;flex:1;background:var(--line);opacity:.7;
}
.fav{
  color:var(--line);
  line-height:0;
  transition:color .4s ease,transform .4s ease;
}
.fav svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.1;}
.fav:hover{color:var(--rose);transform:scale(1.18);}
.fav.is-on{color:var(--rose);}
.fav.is-on svg{fill:var(--rose);}

/* =========================================================
   LIGHTBOX (imagen ampliada)
   ========================================================= */
.lightbox{
  position:fixed;inset:0;z-index:90;
  display:none;
  align-items:center;justify-content:center;
  padding:56px 24px;
  background:rgba(48,40,35,.92);
}
.lightbox.open{display:flex;}
.lb-stage{
  position:relative;
  max-width:min(1100px,92vw);
  max-height:86vh;
  padding:12px;
  border:1px solid rgba(216,196,182,.55);
  background:rgba(250,245,241,.06);
  animation:lbIn .45s cubic-bezier(.2,.7,.2,1);
}
@keyframes lbIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.lb-stage img{
  max-width:100%;
  max-height:calc(86vh - 24px);
  width:auto;height:auto;
  object-fit:contain;
}
.lb-stage .corner{color:rgba(216,196,182,.75);}
.lb-caption{
  margin-top:14px;
  text-align:center;
  font-size:.72rem;
  letter-spacing:.22em;
  color:rgba(246,239,233,.7);
}
.lb-btn{
  position:absolute;
  color:var(--cream);
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(216,196,182,.4);
  background:rgba(48,40,35,.5);
  transition:background .35s ease,color .35s ease;
}
.lb-btn:hover{background:var(--cream);color:var(--ink);}
.lb-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.1;}
.lb-close{top:14px;right:16px;}
.lb-prev{top:50%;left:16px;transform:translateY(-50%);}
.lb-next{top:50%;right:16px;transform:translateY(-50%);}

/* ---------- Aparición al hacer scroll ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease;}
.reveal.in{opacity:1;transform:none;}

:focus-visible{outline:1px solid var(--rose);outline-offset:3px;}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
  .reveal{opacity:1;transform:none;}
  html{scroll-behavior:auto;}
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1040px){
  .grid{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:860px){
  :root{--frame-inset:8px;}
  .section{padding:70px 22px;}
  .lightbox{padding:70px 12px;}
  .lb-prev{left:6px;}
  .lb-next{right:6px;}
}
@media (max-width:620px){
  .grid{grid-template-columns:repeat(2,1fr);gap:34px 20px;}
  .hero{min-height:64vh;padding:80px 20px;}
}
</style>
</head>

  </button>

    <svg class="corner tr" viewBox="0 0 40 40"><use href="#ico-corner"/></svg>
    <svg class="corner bl" viewBox="0 0 40 40"><use href="#ico-corner"/></svg>
    <svg class="corner br" viewBox="0 0 40 40"><use href="#ico-corner"/></svg>
    <figcaption class="lb-caption" id="lbCaption"></figcaption>

<script>
/* ---------- Corazones (Merkliste) ---------- */
document.querySelectorAll('.fav').forEach(btn => {
  btn.addEventListener('click', () => {
    const on = btn.classList.toggle('is-on');
    btn.setAttribute('aria-pressed', on);
  });
});

/* ---------- Lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg     = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
const lbClose   = document.getElementById('lbClose');
const lbPrev    = document.getElementById('lbPrev');
const lbNext    = document.getElementById('lbNext');

let images = [];   // solo las imágenes que existen
let index  = 0;
let lastFocused = null;

function collectImages(){
  images = Array.from(document.querySelectorAll('.grid .frame img'));
  lbPrev.style.display = lbNext.style.display = images.length > 1 ? '' : 'none';
}

function show(i){
  index = (i + images.length) % images.length;
  const img = images[index];
  lbImg.src = img.currentSrc || img.src;
  lbImg.alt = img.alt || '';
  lbCaption.textContent = images.length > 1 ? (index + 1) + ' / ' + images.length : '';
}

function openLightbox(img){
  collectImages();
  const i = images.indexOf(img);
  if (i === -1) return;
  lastFocused = document.activeElement;
  show(i);
  lightbox.classList.add('open');
  document.body.classList.add('no-scroll');
  lbClose.focus();
}

function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.classList.remove('no-scroll');
  lbImg.src = '';
  if (lastFocused) lastFocused.focus();
}

// Abrir al hacer clic en cualquier imagen de la rejilla
document.getElementById('grid').addEventListener('click', e => {
  const img = e.target.closest('.frame img');
  if (img) openLightbox(img);
});

lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', () => show(index - 1));
lbNext.addEventListener('click', () => show(index + 1));

// Cerrar tocando el fondo
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

// Teclado: Esc cierra, flechas navegan
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowLeft')  show(index - 1);
  if (e.key === 'ArrowRight') show(index + 1);
});

// Deslizar en móvil
let touchX = null;
lightbox.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
lightbox.addEventListener('touchend', e => {
  if (touchX === null) return;
  const diff = e.changedTouches[0].clientX - touchX;
  if (Math.abs(diff) > 50) show(index + (diff < 0 ? 1 : -1));
  touchX = null;
}, {passive:true});

/* ---------- Aparición al hacer scroll ---------- */
const io = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if (entry.isIntersecting) {
      entry.target.style.transitionDelay = (i % 4) * 70 + 'ms';
      entry.target.classList.add('in');
      io.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
